name: Playwright Enterprise Automation CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  schedule:
    - cron: '0 2 * * 1-5' # Scheduled regression runs Monday-Friday at 2 AM UTC
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Execution Environment'
        required: true
        default: 'UAT'
        type: choice
        options:
          - DEV
          - QA
          - UAT
          - STAGING
      suite:
        description: 'Test Suite to Execute'
        required: true
        default: 'smoke'
        type: choice
        options:
          - smoke
          - ui
          - api
          - accessibility
          - regression
          - all

jobs:
  test:
    name: Playwright Test Matrix (${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
    timeout-minutes: 60
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2]
        shardTotal: [2]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Validate TypeScript Compilation
        run: npm run type-check

      - name: Run ESLint
        run: npm run lint || true

      - name: Install Playwright Browsers with OS Dependencies
        run: npx playwright install --with-deps chromium

      - name: Execute Playwright Tests
        env:
          ENV: ${{ github.event.inputs.environment || 'UAT' }}
          CI: true
        run: |
          npx playwright test --config config/playwright.config.ts --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}

      - name: Upload Playwright HTML & Trace Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-shard-${{ matrix.shardIndex }}
          path: playwright-report/
          retention-days: 14

      - name: Upload Allure Results Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-shard-${{ matrix.shardIndex }}
          path: allure-results/
          retention-days: 14

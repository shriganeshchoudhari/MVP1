name: Playwright E2E Tests — HDFC Xpress BizFinance

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  # Allow manual trigger with env selection
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'uat'
        type: choice
        options: [ uat, sit ]
      suite:
        description: 'Test suite to run'
        required: true
        default: 'all'
        type: choice
        options: [ all, login, modules, journey ]

jobs:
  # ── Login & OTP baseline tests (fast, runs first) ──────────────────────────
  login-tests:
    name: Login & OTP Tests
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      BASE_URL: ${{ github.event.inputs.environment == 'sit' && secrets.SIT_BASE_URL || secrets.UAT_BASE_URL || 'https://smeclouat.hdfcbank.com' }}
      USER_ID: ${{ secrets.USER_ID || 'A10773' }}
      USER_ID_1: ${{ secrets.USER_ID_1 || 'A10773' }}
      USER_ID_2: ${{ secrets.USER_ID_2 || 'A15183' }}
      USER_ID_3: ${{ secrets.USER_ID_3 || 'A23429' }}
      PASSWORD: ${{ secrets.PASSWORD || 'laser123' }}
      OTP: ${{ secrets.OTP || '123456' }}
      BUSINESS_GROUP: ${{ secrets.BUSINESS_GROUP || 'Working Capital' }}
      BUSINESS_SEGMENT: ${{ secrets.BUSINESS_SEGMENT || 'BBG' }}
      HEADLESS: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Run Login & OTP tests
        run: node_modules/.bin/playwright test tests/login.spec.js --reporter=html,github

      - name: Upload Login Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: login-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 30

      - name: Upload Login Test Results (on failure)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: login-test-results-${{ github.run_id }}
          path: test-results/
          retention-days: 7

  # ── Module-level isolated tests ─────────────────────────────────────────────
  module-tests:
    name: Module Tests
    timeout-minutes: 30
    runs-on: ubuntu-latest
    needs: login-tests   # Only run if login tests pass
    env:
      BASE_URL: ${{ github.event.inputs.environment == 'sit' && secrets.SIT_BASE_URL || secrets.UAT_BASE_URL || 'https://smeclouat.hdfcbank.com' }}
      USER_ID: ${{ secrets.USER_ID || 'A10773' }}
      PASSWORD: ${{ secrets.PASSWORD || 'laser123' }}
      OTP: ${{ secrets.OTP || '123456' }}
      BUSINESS_GROUP: ${{ secrets.BUSINESS_GROUP || 'Working Capital' }}
      BUSINESS_SEGMENT: ${{ secrets.BUSINESS_SEGMENT || 'BBG' }}
      HEADLESS: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Run Module tests
        run: node_modules/.bin/playwright test tests/modules/ --reporter=html,github

      - name: Upload Module Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: module-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 30

      - name: Upload Module Test Results (on failure)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: module-test-results-${{ github.run_id }}
          path: test-results/
          retention-days: 7

  # ── Full E2E journey tests (slowest — runs last) ────────────────────────────
  journey-tests:
    name: Full E2E Journey Tests
    timeout-minutes: 60
    runs-on: ubuntu-latest
    needs: module-tests
    env:
      BASE_URL: ${{ github.event.inputs.environment == 'sit' && secrets.SIT_BASE_URL || secrets.UAT_BASE_URL || 'https://smeclouat.hdfcbank.com' }}
      USER_ID: ${{ secrets.USER_ID || 'A10773' }}
      PASSWORD: ${{ secrets.PASSWORD || 'laser123' }}
      OTP: ${{ secrets.OTP || '123456' }}
      BUSINESS_GROUP: ${{ secrets.BUSINESS_GROUP || 'Working Capital' }}
      BUSINESS_SEGMENT: ${{ secrets.BUSINESS_SEGMENT || 'BBG' }}
      HEADLESS: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Run Full Journey tests
        run: node_modules/.bin/playwright test tests/journey.spec.js --reporter=html,github

      - name: Upload Journey Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: journey-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 30

      - name: Upload Journey Traces & Screenshots (on failure)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: journey-traces-${{ github.run_id }}
          path: test-results/
          retention-days: 14
